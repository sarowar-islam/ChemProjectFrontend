[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://chemprojectbackend.onrender.com/api"

# Redirect old Netlify domain to new custom domain (bcerlab.com)
[[redirects]]
  from = "https://prof-dr-yunus-researchgroup.netlify.app/*"
  to = "https://bcerlab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://prof-dr-yunus-researchgroup.netlify.app/*"
  to = "https://bcerlab.com/:splat"
  status = 301
  force = true

# SPA redirect - Handle client-side routing
# This ensures all routes work with React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
